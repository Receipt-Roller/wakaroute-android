name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first. CI that reports on a commit
# nobody is looking at any more is just queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Runs on the JVM with no emulator, which is why the rules live in
      # `core`. This is where the prerequisite graph is validated: a cycle or a
      # dangling edge fails the build rather than reaching a student's map.
      - name: Unit tests
        run: ./gradlew :core:test

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Release too, not just debug. R8 stripping the kotlinx.serialization
      # serializers turns every API response into an exception — and it is
      # invisible in a debug build.
      - name: Release build
        run: ./gradlew :app:assembleRelease

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core/build/reports/tests/test
            app/build/reports/lint-results-debug.html
